[project]
name = "cdbai"
version = "0.1.1"
description = "cdbai agent for drug response and -omics exploration."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3",
    "db-dtypes",
    "flashtext",
    "google-cloud-bigquery",
    "google-cloud-bigquery-storage",
    "google-auth",
    "jinja2",
    "litellm",
    "matplotlib",
    "numpy",
    "pandas",
    "pillow",
    "python-dotenv",
    "scikit-learn",
    "scipy",
    "seaborn",
    "tenacity",
    "tqdm",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cdbai"]

[tool.setuptools.package-data]
cdbai = ["data/*.csv", "data/*.jinja"]
